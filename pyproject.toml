[project]
name = "job-finder-2"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg2 (>=2.9.11,<3.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "coverage (>=7.13.2,<8.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.12.0"
flake8 = "^7.3.0"
isort = "^7.0.0"
pytest-cov = "^7.0.0"

[tool.black]
line-length = 119
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 119
skip_gitignore = true
extend_skip = [".venv", "venv", "build", "dist"]

[tool.mypy]
files = ["src", "tests"]
exclude = '(^|/)(\.venv|venv|build|dist)/'
ignore_missing_imports = true
check_untyped_defs = true
